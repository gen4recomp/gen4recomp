name: CI

# Runs the static checks and the repository test command on every push and pull
# request. Unit, component, and real offscreen graphics smoke tests are required.
# ROM-conformance and acceptance tests report explicit optional skips because CI
# has no user-owned cartridge dump.
#
# The lint steps mirror the pre-commit hook (scripts/lint.sh). Hooks are opt-in
# per clone and bypassable, so CI is the binding gate.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/ci/structure-requirements.txt

      - name: Install structural check dependencies
        run: python -m pip install --requirement scripts/ci/structure-requirements.txt

      - name: Run structural contract tests
        run: |
          python3 scripts/ci/source_scope_test.py
          python3 scripts/ci/lua_policy_test.py
          python3 scripts/ci/check_structure_budget_test.py
          python3 scripts/ci/codehealth_report_test.py

      - name: Run structural budget check
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            scripts/ci/structure_check.sh --base-ref "$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
            if [ -n "${BEFORE_SHA//0/}" ]; then
              scripts/ci/structure_check.sh --base-ref "$BEFORE_SHA"
            else
              scripts/ci/structure_check.sh
            fi
          elif [ "$EVENT_NAME" = "push" ]; then
            scripts/ci/structure_check.sh --base-ref "origin/$DEFAULT_BRANCH"
          else
            scripts/ci/structure_check.sh
          fi

      - name: Install stylua
        env:
          STYLUA_VERSION: "2.5.2"
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/stylua.zip" \
            "https://github.com/JohnnyMorganz/StyLua/releases/download/v${STYLUA_VERSION}/stylua-linux-x86_64.zip"
          sudo unzip -j "$RUNNER_TEMP/stylua.zip" stylua -d /usr/local/bin
          sudo chmod +x /usr/local/bin/stylua

      - name: Install lua-language-server
        env:
          LUALS_VERSION: "3.19.0"
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/luals.tar.gz" \
            "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz"
          sudo mkdir -p /opt/lua-language-server
          sudo tar -xzf "$RUNNER_TEMP/luals.tar.gz" -C /opt/lua-language-server
          printf '#!/bin/sh\nexec /opt/lua-language-server/bin/lua-language-server "$@"\n' \
            | sudo tee /usr/local/bin/lua-language-server >/dev/null
          sudo chmod +x /usr/local/bin/lua-language-server

      - name: Run static checks
        run: scripts/lint.sh --check

      - name: Download LÖVE 11.5
        env:
          LOVE_VERSION: "11.5"
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/love.AppImage" \
            "https://github.com/love2d/love/releases/download/${LOVE_VERSION}/love-${LOVE_VERSION}-x86_64.AppImage"
          chmod +x "$RUNNER_TEMP/love.AppImage"
          "$RUNNER_TEMP/love.AppImage" --appimage-extract-and-run --version

      - name: Install offscreen graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglx-mesa0

      - name: Run test suite
        env:
          SDL_VIDEODRIVER: offscreen
          LIBGL_ALWAYS_SOFTWARE: "1"
          G4RECOMP_REQUIRE_GRAPHICS_TESTS: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '%s\n' '#!/bin/sh' 'exec "$RUNNER_TEMP/love.AppImage" --appimage-extract-and-run "$@"' > "$RUNNER_TEMP/bin/love"
          chmod +x "$RUNNER_TEMP/bin/love"
          # Keep CI on the same entrypoint and software graphics host as local
          # development; the command reports ROM-gated skips explicitly.
          PATH="$RUNNER_TEMP/bin:$PATH" scripts/test.sh
