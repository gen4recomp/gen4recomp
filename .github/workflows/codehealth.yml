name: Code health Pages

on:
  push:
    branches:
      - master
    paths:
      - '**/*.lua'
      - 'scripts/ci/**'
      - 'site/**'
      - '.github/workflows/codehealth.yml'
  workflow_dispatch:

concurrency:
  group: codehealth-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/ci/codehealth-requirements.txt

      - name: Install report dependencies
        run: |
          python -m pip install jinja2==3.1.6
          python -m pip install --requirement scripts/ci/codehealth-requirements.txt

      - name: Install jscpd
        run: |
          npm install --prefix "$RUNNER_TEMP/jscpd" jscpd@5.0.16
          echo "$RUNNER_TEMP/jscpd/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Log tool versions
        run: |
          python3 --version
          lizard --version
          jscpd --version
          graphify --version

      - name: Test report contract
        run: |
          python3 scripts/ci/source_scope_test.py
          python3 scripts/ci/lua_policy_test.py
          python3 scripts/ci/check_structure_budget_test.py
          python3 scripts/ci/codehealth_report_test.py

      - name: Run structural budget check
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -n "${BEFORE//0/}" ]; then
              scripts/ci/structure_check.sh --base-ref "$BEFORE"
            else
              scripts/ci/structure_check.sh
            fi
          else
            scripts/ci/structure_check.sh
          fi

      - name: Build code-health site
        run: scripts/ci/codehealth.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: tmp/codehealth-site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
