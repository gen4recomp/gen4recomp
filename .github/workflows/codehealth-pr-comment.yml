name: Code health PR comment

# Privileged publication side of the structural hotspot advisory. Runs on
# the default-branch workflow definition after the read-only analysis
# workflow completes, validates the untrusted result artifact as data, and
# maintains one advisory PR comment. Never checks out or executes pull
# request code or artifact content.

on:
  workflow_run:
    workflows:
      - Code health PR
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: read
  issues: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download comparison result
        uses: actions/download-artifact@v5
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: codehealth-pr-result
          path: ${{ runner.temp }}/codehealth-pr-result

      - name: Validate and render advisory publication
        env:
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          ASSOCIATED_PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          python3 scripts/ci/codehealth_pr_comment.py \
            --artifact "$RUNNER_TEMP/codehealth-pr-result/result.json" \
            --run-head-sha "$RUN_HEAD_SHA" \
            --associated-pull-requests "$ASSOCIATED_PRS" \
            --output "$RUNNER_TEMP/codehealth-publication.json"

      - name: Maintain advisory comment
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const MARKER = '<!-- gen4recomp-codehealth-hotspot-advisory -->';

            function fail(message) {
              core.setFailed(`codehealth comment: ${message}`);
            }

            let publication;
            try {
              const raw = fs.readFileSync(
                path.join(process.env.RUNNER_TEMP, 'codehealth-publication.json'),
                'utf8',
              );
              publication = JSON.parse(raw);
            } catch (error) {
              fail(`cannot load validated publication as data: ${error.message}`);
              return;
            }

            let pull;
            try {
              pull = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: publication.pullRequest,
              });
            } catch (error) {
              fail(`cannot fetch pull request: ${error.message}`);
              return;
            }
            const current = pull.data;
            if (current.state !== 'open') {
              core.info('codehealth comment: pull request is not open; no mutation');
              return;
            }
            const headSha = current.head && current.head.sha;
            const mergeSha = current.merge_commit_sha;
            if (publication.headSha !== headSha && publication.headSha !== mergeSha) {
              core.info('codehealth comment: result is stale for the current revision; no mutation');
              return;
            }
            if (current.base && current.base.sha && publication.baseSha !== current.base.sha) {
              core.info('codehealth comment: result base no longer matches; no mutation');
              return;
            }

            const issueNumber = publication.pullRequest;
            let owned;
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100,
              });
              owned = comments.find(
                (comment) =>
                  comment &&
                  comment.user &&
                  comment.user.type === 'Bot' &&
                  typeof comment.body === 'string' &&
                  comment.body.includes(MARKER),
              );
            } catch (error) {
              fail(`cannot list pull request comments: ${error.message}`);
              return;
            }

            if (publication.regressions.length === 0) {
              if (owned) {
                try {
                  await github.rest.issues.deleteComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: owned.id,
                  });
                } catch (error) {
                  fail(`cannot delete resolved advisory comment: ${error.message}`);
                }
              }
              return;
            }

            const body = publication.body;

            try {
              if (owned) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: owned.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body,
                });
              }
            } catch (error) {
              fail(`cannot publish advisory comment: ${error.message}`);
            }
